# Retirement answer for a Relay version that is being sunset.
#
# Include this snippet in the `remote.openbitfun.com` server block *instead of*
# `nginx-location.conf` for the retired prefix, after the retired version's own
# Compose project has been stopped. It is the edge-only form: it keeps working
# after the retired container, image and volume are deleted, and it answers the
# same machine-readable body the relay serves itself, so current clients
# classify it as "update the client" rather than as a network fault.
#
# Replace 1.0.1 with the version being retired. Keep one block per retired
# version; never reuse the live version's location.
#
# The body must stay byte-compatible with the relay's own answer. The shared
# contract is pinned by
# `src/crates/services/relay-service/src/retired_version.rs`:
#   error            = "relay_version_retired"
#   update_required  = true

location = /v/1.0.1 {
    return 308 /v/1.0.1/;
}

location ^~ /v/1.0.1/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    # Clients must not retry this as a transient failure, but they may present
    # it again after an update.
    return 410 '{"error":"relay_version_retired","message":"This Relay version has been retired. Update OpenBitFun on this device, then sign in again to continue.","update_required":true}';
}
